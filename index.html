<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>MESA KIMI | Premium Yönetim Paneli</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            --primary-light: #fb923c;
            --primary-dark: #ea580c;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-secondary); color: var(--text-primary); min-height: 100vh; }
        .app { max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; box-shadow: var(--shadow-lg); }
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
        .spinner { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .header { background: var(--bg-primary); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 44px; height: 44px; background: linear-gradient(135deg, #f97316, #fb923c); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 10px 40px -10px rgba(249, 115, 22, 0.3); }
        .brand-text h1 { font-size: 20px; font-weight: 800; }
        .brand-text p { font-size: 12px; color: var(--text-muted); }
        .menu-btn { width: 44px; height: 44px; border: none; background: var(--bg-tertiary); border-radius: 12px; font-size: 20px; cursor: pointer; }
        .quick-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 20px 20px; }
        .quick-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; transition: all 0.2s; }
        .quick-btn:hover { border-color: var(--primary); box-shadow: 0 10px 40px -10px rgba(249, 115, 22, 0.2); }
        .quick-btn-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
        .quick-btn:nth-child(1) .quick-btn-icon { background: rgba(249, 115, 22, 0.1); }
        .quick-btn:nth-child(2) .quick-btn-icon { background: rgba(14, 165, 233, 0.1); }
        .quick-btn:nth-child(3) .quick-btn-icon { background: rgba(16, 185, 129, 0.1); }
        .quick-btn:nth-child(4) .quick-btn-icon { background: rgba(245, 158, 11, 0.1); }
        .quick-btn span { font-size: 14px; font-weight: 600; }
        .main { padding: 20px; }
        .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .section-title h2 { font-size: 18px; font-weight: 700; }
        .section-title a { color: var(--primary); font-weight: 600; text-decoration: none; cursor: pointer; }
        .stats-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .stats-grid::-webkit-scrollbar { display: none; }
        .stat-card { flex: 0 0 auto; min-width: 140px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        .stat-card.primary { background: linear-gradient(135deg, #f97316, #fb923c); border: none; color: white; }
        .stat-value { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
        .stat-label { font-size: 13px; color: var(--text-muted); }
        .stat-card.primary .stat-label { color: rgba(255,255,255,0.8); }
        .bot-list { display: flex; flex-direction: column; gap: 10px; }
        .bot-item { display: flex; align-items: center; gap: 14px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 16px; padding: 16px; cursor: pointer; transition: all 0.2s; }
        .bot-item:hover { border-color: var(--primary); background: var(--bg-tertiary); }
        .bot-avatar { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .bot-info { flex: 1; }
        .bot-name { font-weight: 700; margin-bottom: 2px; }
        .bot-meta { font-size: 13px; color: var(--text-muted); }
        .bot-stat { text-align: right; }
        .bot-stat-value { font-size: 18px; font-weight: 800; }
        .bot-stat-label { font-size: 11px; color: var(--text-muted); }
        .bottom-nav { position: sticky; bottom: 0; background: var(--bg-primary); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 20px 24px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover { background: var(--bg-tertiary); }
        .nav-item.active { background: rgba(249, 115, 22, 0.1); }
        .nav-item.active .nav-icon { color: var(--primary); }
        .nav-item.active .nav-label { color: var(--primary); font-weight: 600; }
        .nav-icon { font-size: 24px; color: var(--text-muted); }
        .nav-label { font-size: 11px; color: var(--text-muted); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; }
        .modal-overlay.active { display: block; }
        .sub-menu { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 440px; max-height: 70vh; background: var(--bg-primary); border-radius: 24px; padding: 20px; box-shadow: var(--shadow-lg); z-index: 201; display: none; overflow-y: auto; }
        .sub-menu.active { display: block; }
        .sub-menu-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .sub-menu-title { font-size: 18px; font-weight: 700; }
        .sub-menu-close { width: 36px; height: 36px; border: none; background: var(--bg-tertiary); border-radius: 10px; font-size: 18px; cursor: pointer; }
        .sub-menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .sub-menu-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 12px; background: var(--bg-tertiary); border-radius: 16px; cursor: pointer; transition: all 0.2s; }
        .sub-menu-item:hover { background: var(--border); }
        .sub-menu-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .sub-menu-name { font-size: 13px; font-weight: 600; text-align: center; }
        .sub-menu-desc { font-size: 11px; color: var(--text-muted); }
        .error-message { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; padding: 16px; margin: 20px; text-align: center; color: #ef4444; }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <p>MESA KIMI yükleniyor...</p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#f8fafc'); }

        let allBots = [];
        let dashboardData = {};

        async function api(endpoint) {
            try {
                const res = await fetch(`${API_BASE}/api${endpoint}`);
                if (!res.ok) throw new Error('API hatası');
                const data = await res.json();
                return data.success ? data.data : null;
            } catch (err) {
                console.error('API hatası:', err);
                return null;
            }
        }

        async function loadData() {
            try {
                const [dashboard, bots] = await Promise.all([
                    api('/dashboard'),
                    api('/bots')
                ]);
                
                if (dashboard) dashboardData = dashboard;
                if (bots) allBots = bots;
                
                renderApp();
            } catch (err) {
                console.error('Veri yükleme hatası:', err);
                document.getElementById('app').innerHTML = `
                    <div class="error-message">
                        Veri yüklenirken hata oluştu. Lütfen sayfayı yenileyin.
                    </div>
                `;
            }
        }

        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="app">
                    <header class="header">
                        <div class="header-top">
                            <div class="brand">
                                <div class="brand-logo">🤖</div>
                                <div class="brand-text">
                                    <h1>MESA KIMI</h1>
                                    <p>Premium Yönetim</p>
                                </div>
                            </div>
                            <button class="menu-btn" onclick="toggleSubMenu()">☰</button>
                        </div>

                        <div class="quick-menu">
                            <button class="quick-btn" onclick="showPage('announcements')">
                                <div class="quick-btn-icon">📢</div>
                                <span>Duyurular</span>
                            </button>
                            <button class="quick-btn" onclick="showPage('bots')">
                                <div class="quick-btn-icon">🤖</div>
                                <span>Botlar</span>
                            </button>
                            <button class="quick-btn" onclick="showPage('users')">
                                <div class="quick-btn-icon">👥</div>
                                <span>Kullanıcılar</span>
                            </button>
                            <button class="quick-btn" onclick="showPage('reports')">
                                <div class="quick-btn-icon">📊</div>
                                <span>Raporlar</span>
                            </button>
                        </div>
                    </header>

                    <main class="main">
                        <div class="section-title">
                            <h2>Canlı İstatistikler</h2>
                            <a onclick="refreshData(); return false;">Yenile 🔄</a>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-card primary">
                                <div class="stat-value">${formatNumber(dashboardData.totalUsers || 0)}</div>
                                <div class="stat-label">Kullanıcı</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${dashboardData.activeBots || 0}</div>
                                <div class="stat-label">Aktif Bot</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${formatNumber(dashboardData.todayMessages || 0)}</div>
                                <div class="stat-label">Bugün Mesaj</div>
                            </div>
                        </div>

                        <div class="section-title" style="margin-top: 24px;">
                            <h2>Sektör Botları</h2>
                            <a onclick="toggleSubMenu(); return false;">Tümü →</a>
                        </div>

                        <div class="bot-list">
                            ${allBots.slice(0, 3).map(bot => `
                                <div class="bot-item" onclick="openBot('${bot.id}')">
                                    <div class="bot-avatar" style="background: ${bot.color || '#3b82f6'}20;">${bot.icon || '🤖'}</div>
                                    <div class="bot-info">
                                        <div class="bot-name">${bot.name}</div>
                                        <div class="bot-meta">${bot.users || 0} kullanıcı • ${bot.status === 'active' ? '🟢 Aktif' : '🟡 Sınırlı'}</div>
                                    </div>
                                    <div class="bot-stat">
                                        <div class="bot-stat-value">${bot.messages || 0}</div>
                                        <div class="bot-stat-label">mesaj</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </main>

                    <div class="modal-overlay" id="modalOverlay" onclick="toggleSubMenu()"></div>
                    <div class="sub-menu" id="subMenu">
                        <div class="sub-menu-header">
                            <div class="sub-menu-title">Tüm Sektör Botları (${allBots.length})</div>
                            <button class="sub-menu-close" onclick="toggleSubMenu()">✕</button>
                        </div>
                        <div class="sub-menu-grid">
                            ${allBots.map(bot => `
                                <div class="sub-menu-item" onclick="openBot('${bot.id}')">
                                    <div class="sub-menu-icon" style="background: ${bot.color || '#3b82f6'}20;">${bot.icon || '🤖'}</div>
                                    <div class="sub-menu-name">${bot.name}</div>
                                    <div class="sub-menu-desc">${bot.users || 0} kullanıcı</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <nav class="bottom-nav">
                        <div class="nav-item active">
                            <span class="nav-icon">🏠</span>
                            <span class="nav-label">Ana Sayfa</span>
                        </div>
                        <div class="nav-item" onclick="toggleSubMenu()">
                            <span class="nav-icon">🤖</span>
                            <span class="nav-label">Botlar</span>
                        </div>
                        <div class="nav-item" onclick="showPage('announcements')">
                            <span class="nav-icon">📢</span>
                            <span class="nav-label">Duyurular</span>
                        </div>
                        <div class="nav-item" onclick="showPage('profile')">
                            <span class="nav-icon">👤</span>
                            <span class="nav-label">Profil</span>
                        </div>
                    </nav>
                </div>
            `;
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function toggleSubMenu() {
            document.getElementById('modalOverlay').classList.toggle('active');
            document.getElementById('subMenu').classList.toggle('active');
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function openBot(id) {
            const bot = allBots.find(b => b.id === id);
            if (tg) {
                tg.HapticFeedback.impactOccurred('medium');
                tg.sendData(JSON.stringify({ action: 'open_bot', bot }));
            }
            toggleSubMenu();
        }

        function showPage(page) {
            if (tg) {
                tg.HapticFeedback.impactOccurred('light');
                tg.sendData(JSON.stringify({ action: 'navigate', page }));
            }
        }

        function refreshData() {
            document.getElementById('app').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Yenileniyor...</p>
                </div>
            `;
            loadData();
        }

        // Başlat
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
